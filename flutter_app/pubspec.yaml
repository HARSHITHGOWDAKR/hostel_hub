name: campus_hostel_delivery
description: "Campus Hostel Store & Food Delivery Flutter Application with Firebase Cloud Firestore"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  google_maps_flutter: ^2.6.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  audioplayers: ^6.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
